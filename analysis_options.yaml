# Analyzer and linter configuration for Dream Pet Island.
#
# This project ships as a commercial product, so this configuration is
# intentionally stricter than the Flutter default. It builds on
# package:flutter_lints and layers additional analyzer strictness and lint
# rules on top. See CLAUDE.md for the engineering rules this configuration
# supports.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Stricter static analysis modes (in addition to Dart's sound null safety,
  # which is already enforced by this project's SDK constraint and requires
  # no separate flag here).
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Elevate diagnostics that matter for a long-lived commercial codebase
    # from hints/info to warnings so they are never silently ignored.
    dead_code: warning
    unused_import: warning
    unused_element: warning
    unused_local_variable: warning
    unused_field: warning

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

# Dart's sound null safety (enforced by the SDK, not a lint) already makes a
# function body that can complete without returning a non-nullable value a
# compile-time error, so missing-return cases are caught before analysis
# even reaches the linter below.

formatter:
  # Enforce a single, consistent formatting style across the codebase.
  page_width: 80
  trailing_commas: preserve

linter:
  rules:
    # --- Variable and field declarations ---
    prefer_final_locals: true
    prefer_final_fields: true
    prefer_final_in_for_each: true
    avoid_unused_constructor_parameters: true

    # --- Const correctness ---
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # --- Type safety / avoiding dynamic ---
    avoid_dynamic_calls: true
    avoid_annotating_with_dynamic: true
    always_declare_return_types: true
    type_annotate_public_apis: true

    # --- Dead/unreachable code and resource safety ---
    avoid_returning_null_for_void: true
    cancel_subscriptions: true
    close_sinks: true
    unawaited_futures: true
    unnecessary_statements: true

    # --- Consistency and readability ---
    directives_ordering: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_child_properties_last: true
    use_key_in_widget_constructors: true
